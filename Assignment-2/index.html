<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM To-Do List</title>
  <style>
    * { box-sizing: border-box; } body { font-family: Arial,sans-serif; background:#f1f5f9; margin:0; padding:40px 16px; }
    main { max-width:560px; margin:auto; background:white; padding:24px; border-radius:12px; box-shadow:0 8px 24px #0001; }
    form { display:flex; gap:8px; } input { flex:1; min-width:0; padding:11px; } button { padding:10px 12px; border:0; border-radius:6px; cursor:pointer; }
    .add { background:#2563eb;color:white; } ul { list-style:none; padding:0; } li { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid #e5e7eb; }
    .task { flex:1; overflow-wrap:anywhere; } .completed { text-decoration:line-through; color:#64748b; } .done { background:#dcfce7; } .delete { background:#fee2e2; }
  </style>
</head>
<body>
  <main>
    <h1>My To-Do List</h1>
    <form id="taskForm"><input id="taskInput" placeholder="Enter a task" aria-label="Task" required><button class="add" type="submit">Add Task</button></form>
    <ul id="taskList"></ul>
  </main>
  <script>
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");
    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const item = document.createElement("li");
      const task = document.createElement("span");
      task.className = "task"; task.textContent = text;
      const done = document.createElement("button");
      done.type = "button"; done.className = "done"; done.textContent = "Complete";
      done.addEventListener("click", () => { task.classList.toggle("completed"); done.textContent = task.classList.contains("completed") ? "Undo" : "Complete"; });
      const remove = document.createElement("button");
      remove.type = "button"; remove.className = "delete"; remove.textContent = "Delete";
      remove.addEventListener("click", () => item.remove());
      item.append(task, done, remove); list.appendChild(item);
      input.value = ""; input.focus();
    });
  </script>
</body>
</html>

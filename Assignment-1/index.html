<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f1f5f9; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .calculator { width: min(340px, 92vw); padding: 24px; background: white; border-radius: 12px; box-shadow: 0 8px 24px #0001; }
    input, select, button { width: 100%; padding: 11px; margin-top: 12px; font-size: 16px; }
    button { background: #2563eb; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    #result { min-height: 24px; font-weight: bold; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>JavaScript Calculator</h1>
    <input type="number" id="num1" step="any" placeholder="Enter first number">
    <select id="operator" aria-label="Operation">
      <option value="+">Addition (+)</option>
      <option value="-">Subtraction (−)</option>
      <option value="*">Multiplication (×)</option>
      <option value="/">Division (÷)</option>
    </select>
    <input type="number" id="num2" step="any" placeholder="Enter second number">
    <button onclick="calculate()">Calculate</button>
    <p id="result" aria-live="polite">Result will appear here.</p>
  </main>
  <script>
    function calculate() {
      const first = document.getElementById("num1").value;
      const second = document.getElementById("num2").value;
      const operator = document.getElementById("operator").value;
      const output = document.getElementById("result");
      if (first.trim() === "" || second.trim() === "") {
        output.textContent = "Please enter both numbers.";
        return;
      }
      const num1 = Number(first), num2 = Number(second);
      let result;
      switch (operator) {
        case "+": result = num1 + num2; break;
        case "-": result = num1 - num2; break;
        case "*": result = num1 * num2; break;
        case "/":
          if (num2 === 0) { output.textContent = "Cannot divide by zero."; return; }
          result = num1 / num2; break;
        default: output.textContent = "Invalid operation."; return;
      }
      output.textContent = "Result: " + result;
    }
  </script>
</body>
</html>
